name: Optional Cryptol bridge

on:
  workflow_dispatch:
    inputs:
      polyfun_ref:
        description: PolyFun revision containing the continuous-domain and recurrence foundations
        required: true
        type: string
  workflow_call:
    inputs:
      polyfun_ref:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      POLYFUN_PATH: ${{ github.workspace }}/PolyFun
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: VCVio
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Verified-zkEVM/PolyFun
          ref: ${{ inputs.polyfun_ref }}
          path: PolyFun
      - name: Set up Lean
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: VCVio
      - name: Resolve the optional package and fetch Mathlib cache
        working-directory: VCVio
        run: |
          lake -R -KpolyfunPath="$POLYFUN_PATH" update PolyFun --keep-toolchain
          lake -KpolyfunPath="$POLYFUN_PATH" exe cache get
          lake -KpolyfunPath="$POLYFUN_PATH" build mathlib/lint-style
      - name: Check proofs, consumers, axioms, native execution and rejection cases
        working-directory: VCVio
        run: bash Interop/Cryptol/scripts/validate.sh --lint --test --axioms
